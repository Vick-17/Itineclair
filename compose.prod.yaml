name: itineclair

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgis/postgis:17-3.5-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - data


  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile.prod

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}

      ITINECLAIR_WEATHER_ENABLED: ${ITINECLAIR_WEATHER_ENABLED:-false}
      ITINECLAIR_WEATHER_BASE_URL: ${ITINECLAIR_WEATHER_BASE_URL:-https://customer-api.open-meteo.com}
      ITINECLAIR_WEATHER_API_KEY: ${ITINECLAIR_WEATHER_API_KEY:-}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/api/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    networks:
      - app
      - data


  # ---------------------------------------------------------------------------
  # WEB / REVERSE PROXY
  # ---------------------------------------------------------------------------

  web:
    build:
      context: .
      dockerfile: .docker/web/Dockerfile.prod

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    networks:
      - edge
      - app


# -----------------------------------------------------------------------------
# VOLUMES
# -----------------------------------------------------------------------------

volumes:
  postgres-data:


# -----------------------------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------------------------

networks:

  edge:

  app:

  data:
    internal: true
