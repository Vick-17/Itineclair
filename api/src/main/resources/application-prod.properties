# -----------------------------------------------------------------------------
# PRODUCTION
# -----------------------------------------------------------------------------

# Aucun cookie d'authentification ne doit circuler en HTTP.
server.servlet.session.cookie.secure=true
itineclair.security.secure-cookies=true

# Ne jamais exposer de détails internes dans les erreurs HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Seul le healthcheck est exposé en production.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# La documentation développeur n'a pas besoin d'être exposée publiquement.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Pas de SQL détaillé dans les logs de production.
spring.jpa.show-sql=false

logging.level.root=INFO
