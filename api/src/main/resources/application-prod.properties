# -----------------------------------------------------------------------------
# PRODUCTION
# -----------------------------------------------------------------------------

# Aucun cookie d'authentification ne doit circuler en HTTP.
server.servlet.session.cookie.secure=true
itineclair.security.secure-cookies=true

# En production, l'API n'est joignable que par le reverse proxy Docker.
# Tomcat peut donc utiliser son X-Forwarded-For pour retrouver l'IP cliente.
server.forward-headers-strategy=native

# Ne jamais exposer de détails internes dans les erreurs HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Seul le healthcheck est exposé en production.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# La documentation développeur n'a pas besoin d'être exposée publiquement.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Pas de SQL détaillé dans les logs de production.
spring.jpa.show-sql=false

logging.level.root=INFO

# La météo reste désactivée tant qu'un abonnement commercial n'est pas configuré.
itineclair.weather.open-meteo.enabled=${ITINECLAIR_WEATHER_ENABLED:false}
itineclair.weather.open-meteo.base-url=${ITINECLAIR_WEATHER_BASE_URL:https://customer-api.open-meteo.com}
itineclair.weather.open-meteo.api-key=${ITINECLAIR_WEATHER_API_KEY:}
