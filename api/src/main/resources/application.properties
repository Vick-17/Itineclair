spring.application.name=itineclair-api

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------

server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/api

# Session serveur : cookie uniquement, jamais dans l'URL.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=ITINECLAIR_SESSION
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ITINECLAIR_SECURE_COOKIES:false}

# Partagé avec le cookie CSRF configuré par Spring Security.
itineclair.security.secure-cookies=${ITINECLAIR_SECURE_COOKIES:false}

# Protection de la connexion contre le brute-force et le credential stuffing.
itineclair.security.login-protection.ip-attempts=20
itineclair.security.login-protection.ip-window=1m
itineclair.security.login-protection.account-ip-attempts=5
itineclair.security.login-protection.account-ip-window=15m
itineclair.security.login-protection.account-attempts=50
itineclair.security.login-protection.account-window=1h
itineclair.security.login-protection.maximum-keys-per-scope=10000

# Arrêt propre de l'application.
server.shutdown=graceful


# -----------------------------------------------------------------------------
# DATABASE
# -----------------------------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itineclair}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:itineclair}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:itineclair}

# Taille volontairement modeste pour le MVP.
spring.datasource.hikari.maximum-pool-size=10


# -----------------------------------------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------------------------------------

# Les migrations Flyway sont responsables du schéma.
# Hibernate n'a pas le droit de le modifier automatiquement.
spring.jpa.hibernate.ddl-auto=validate

# Évite les accès BDD implicites depuis la couche HTTP.
spring.jpa.open-in-view=false

# Les timestamps persistés sont normalisés en UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# -----------------------------------------------------------------------------
# FLYWAY
# -----------------------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true


# -----------------------------------------------------------------------------
# UPLOAD
# -----------------------------------------------------------------------------

# Première défense contre les fichiers anormalement volumineux.
# Le parseur GPX aura ses propres contrôles supplémentaires.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# -----------------------------------------------------------------------------
# ACTUATOR
# -----------------------------------------------------------------------------

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Limite métier appliquée pendant l’analyse XML en flux.
itineclair.track.max-points=50000
