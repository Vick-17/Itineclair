server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Même limite que Spring pour le futur upload GPX.
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
        always;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # React SPA
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------

    location /api/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Docker healthcheck
    # -------------------------------------------------------------------------

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
